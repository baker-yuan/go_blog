syntax = "proto3";
package go_blog.auth;
option  go_package ="github.com/baker-yuan/go-blog/go_blog/protocol/auth";

import "validate/validate.proto";
import "trpc/proto/trpc_options.proto";
import "trpc/swagger/swagger.proto";

// validate参考
// https://github.com/bufbuild/protoc-gen-validate/blob/v1.0.2/README.md

// trpc参考
// https://github.com/trpc-group/trpc-cmdline/blob/483259c22a2fd1e477c7ebc4b5b1572a5a47010c/docs/examples/example-1/README.zh_CN.md
// https://github.com/trpc-group/trpc-cmdline/blob/483259c22a2fd1e477c7ebc4b5b1572a5a47010c/docs/examples/example-2/README.zh_CN.md




// 空响应
message EmptyRsp {

}

// 添加修改资源返回值
message AddOrUpdateRsp {
  uint32 id = 1; // 资源id
}

// 资源类型
enum ResourceType {
  RT_UNKNOWN = 0; // 未知
  TB_MENU = 1; // 菜单
  TB_RESOURCE = 2; // 接口
  TB_ROLE = 3; // 角色
  TB_TREE_NODE = 4; // 角色
}


// 菜单资源信息定义
message Menu {
  // 基本信息
  uint32 id = 1;                  // ID
  uint32 parent_id = 2;           // 父级菜单id
  string name = 3;                // 菜单名称
  string icon = 4;                // 菜单图标
  string describe = 5;            // 功能描述
  uint32 sort_value = 6;          // 排序
  // 前端
  string path = 7;                // 对应路由path
  string component = 8;           // 对应路由组件component
  // 状态
  bool is_hidden = 9;             // 是否隐藏
  // 公共字段
  uint32 create_user_id = 10;     // 创建人id
  uint32 update_user_id = 11;     // 更新人id
  uint32 create_time = 12;        // 创建时间
  uint32 update_time = 13;        // 更新时间

  // 查询补充字段
  string create_user = 100;        // 创建人id
  string update_user = 101;        // 更新人id
  repeated Menu children = 200; // 子节点
}


// 菜单搜索
message SearchMenuReq {
  string search = 1; // 查询条件 {a:?,b:?}

  uint32 page_num = 100 [(validate.rules).uint32.gt = 0]; // 分页查询
  uint32 page_size = 101 [(validate.rules).uint32.gt = 0]; // 分页查询
}

message SearchMenuRsp {
  repeated Menu data = 2; // 菜单集合

  // 分页数据
  uint32 page_total = 100; // 分页查询
  uint32 page_num = 101; // 分页查询
  uint32 page_size = 102; // 分页查询
}

// 菜单详情
message MenuDetailReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 添加修改菜单
message AddOrUpdateMenuReq {
  // 基本信息
  uint32 id = 1;                                                        // ID
  uint32 parent_id = 2;                // 父级菜单id
  string name = 3 [(validate.rules).string.min_len = 1];                // 菜单名称
  string icon = 4 [(validate.rules).string.min_len = 1];                // 菜单图标
  string describe = 5;            // 功能描述
  uint32 sort_value = 6 [(validate.rules).uint32.gt = 0];               // 排序
  // 前端
  string path = 7 [(validate.rules).string.min_len = 1];                // 对应路由path
  string component = 8;           // 对应路由组件component
  // 状态
  bool is_hidden = 9;                                                    // 是否隐藏
}

// 删除菜单
message DeleteMenuReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 菜单树
message GetMenuTreeReq {
  string name = 1 ; // 菜单名称

  uint32 page_num = 100; // 分页查询
  uint32 page_size = 101; // 分页查询
}

message GetMenuTreeRsp {
  repeated Menu nodes = 1;

  // 分页数据
  uint32 page_total = 100; // 分页查询
  uint32 page_num = 101; // 分页查询
  uint32 page_size = 102; // 分页查询
}



// Status 接口状态枚举
enum ResourceStatus {
  UNPUBLISHED = 0;     // 未发布
  PUBLISHED = 1;       // 已发布
  OFFLINE = 2;         // 以下线
}

// 是否标准化输出响应 0-否 1-是
enum NeedStdRes {
  RES_NOT_REQUIRED = 0; // 不需要否标准化输出
  RES_REQUIRED = 1;     // 需要否标准化输出
}

// 定义是否需要登录校验的枚举
enum NeedLogin {
  LOGIN_NOT_REQUIRED = 0; // 不需要登录校验
  LOGIN_REQUIRED = 1;     // 需要登录校验
}

// 定义是否需要权限校验的枚举
enum NeedPermission {
  PERMISSION_NOT_REQUIRED = 0; // 不需要权限校验
  PERMISSION_REQUIRED = 1;     // 需要权限校验
}

// http请求方式
enum HttpMethod {
  UNKNOWN = 0;
  GET = 1;
  POST = 2;
  PUT = 3;
  PATCH = 4;
  DELETE = 5;
}

// 接口协议
enum MethodProtocol {
  Http = 0; // http
  Trpc = 1; // 腾讯trpc框架
}

// 接口信息定义
message Resource {
  // 基本信息
  uint32 id = 1;                  // ID
  uint32 tree_node_id = 2;        // 树节点ID
  string name = 3;                // 接口名称
  string describe = 4;            // 接口描述
  // 个性化
  NeedStdRes is_need_std_res = 100;        // 是否标准化输出
  // 状态
  ResourceStatus status = 200;              // 接口状态 0-未发布 1-已发布 2-以下线
  // 路径定位
  string url = 300;                 // 接口URL
  HttpMethod http_method = 301;  // 请求方式 1-get 2-post 3-put 4-patch 5-delete
  // 权限校验
  NeedLogin is_need_login = 400;         // 是否需要登录校验
  NeedPermission is_need_permission = 401;   // 是否需要权限校验
  // 下游服务信息
  string service = 500;            // API服务名
  string method = 501;             // API接口名
  MethodProtocol protocol = 502;         // 协议
  // 公共字段
  uint32 create_user_id = 600;        // 创建人id
  uint32 update_user_id = 601;        // 更新人id
  uint32 create_time = 602;        // 创建时间
  uint32 update_time = 603;        // 更新时间
  // 查询补充
  string create_user = 10000;        // 创建人
  string update_user = 10001;        // 更新人
  string tree_node_path = 10002;     // 树节点路径
}

// 接口搜索
message SearchResourceReq {
  string search = 1; // 查询条件 {a:?,b:?}

  uint32 page_num = 100 [(validate.rules).uint32.gt = 0]; // 分页查询
  uint32 page_size = 101 [(validate.rules).uint32.gt = 0]; // 分页查询
}

message SearchResourceRsp {
  repeated Resource data = 1; // 接口集合

  // 分页数据
  uint32 page_total = 100; // 分页查询
  uint32 page_num = 101; // 分页查询
  uint32 page_size = 102; // 分页查询
}

// 接口详情
message ResourceDetailReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 添加修改接口
message AddOrUpdateResourceReq {
  // 基本信息
  uint32 id = 1; // ID
  uint32 tree_node_id = 2; // 树节点ID
  string name = 3 [(validate.rules).string.min_len = 1]; // 接口名称
  string describe = 4; // 接口描述
  // 个性化
  NeedStdRes is_need_std_res = 100;        // 是否标准化输出
  //
  ResourceStatus status = 200 [(validate.rules).enum = {in: [0,1,2]}]; // 接口状态 0-未发布 1-已发布 2-以下线
  // 路径定位
  string url = 300 [(validate.rules).string.min_len = 1]; // 接口URL
  HttpMethod http_method = 301 [(validate.rules).enum = {in: [1,2,3,4,5]}]; // 请求方式
  // 权限校验
  NeedLogin is_need_login = 400; // 是否需要登录校验
  NeedPermission is_need_permission = 401; // 是否需要权限校验
  // 下游服务信息
  string service = 500 [(validate.rules).string.min_len = 1]; // API服务名
  string method = 501; // API接口名
  MethodProtocol protocol = 502;         // 协议
}

// 删除接口
message DeleteResourceReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 获取有效状态下的接口
message GetEffectiveResourceReq {

}

message GetEffectiveResourceRsp {
  repeated Resource data = 1; // 接口集合
}

// 角色信息定义
message Role {
  // 基本信息
  uint32 id = 1;                  // ID
  string name = 2;                // 角色名称
  string code = 3;                // 角色编码
  string describe = 4;            // 描述
  //
  bool is_enable = 5;             // 是否启用
  // 公共字段
  uint32 create_user_id = 6;      // 创建人id
  uint32 update_user_id = 7;      // 更新人id
  uint32 create_time = 8;         // 创建时间
  uint32 update_time = 9;         // 更新时间
  // 查询补充
  string create_user = 100;        // 创建人
  string update_user = 101;        // 更新人
}

// 角色搜索
message SearchRoleReq {
  string search = 1; // 查询条件 {a:?,b:?}

  uint32 page_num = 100 [(validate.rules).uint32.gt = 0]; // 分页查询
  uint32 page_size = 101 [(validate.rules).uint32.gt = 0]; // 分页查询
}

message SearchRoleRsp {
  repeated Role data = 1; // 角色集合

  // 分页数据
  uint32 page_total = 100; // 分页查询
  uint32 page_num = 101; // 分页查询
  uint32 page_size = 102; // 分页查询
}

// 角色详情
message RoleDetailReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 添加修改角色
message AddOrUpdateRoleReq {
  // 基本信息
  uint32 id = 1 [(validate.rules).uint32.gt = 0];                  // ID
  string name = 2 [(validate.rules).string.min_len = 1];           // 角色名称
  string code = 3 [(validate.rules).string.min_len = 1];           // 角色编码
  string describe = 4;            // 功能描述
  //
  bool is_enable = 5;             // 是否启用
}

// 删除角色
message DeleteRoleReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 权限类型 1-菜单 2-资源
enum AuthorityType {
  UNSPECIFIED = 0;
  MENU = 1; // 菜单
  RESOURCE = 2; // 资源
}

// RoleAuthority 角色关联的资源和目录
message RoleAuthority {
  uint32 id = 1;                   // ID
  uint32 authority_id = 2;         // 权限id
  AuthorityType authority_type = 3;// 权限类型 1-菜单 2-资源
  uint32 role_id = 4;              // 角色id

  uint32 create_user_id = 5;       // 创建人ID
  uint32 create_time = 6;          // 插入时间

  // 查询补充
  string create_user = 100;        // 创建人
}



// UserRole 账号角色关联
message UserRole {
  uint32 id = 1;          // ID
  uint32 role_id = 2;     // 角色ID
  uint32 user_id = 3;     // 用户ID

  uint32 create_user_id = 4; // 创建人ID
  uint32 create_time = 5;    // 插入时间

  // 查询补充
  string create_user = 100;        // 创建人
}


// 角色绑定菜单权限
message RoleBindMenuReq {
  uint32 role_id = 1 [(validate.rules).uint32.gt = 0]; // 角色ID
  repeated uint32 menu_ids = 2 [(validate.rules).repeated.min_items = 1]; // 菜单ID集合
}

// 角色绑定资源权限
message RoleBindResourceReq {
  uint32 role_id = 1 [(validate.rules).uint32.gt = 0]; // 角色ID
  repeated uint32 resource_ids = 2 [(validate.rules).repeated.min_items = 1]; // 资源ID集合
}

// 用户绑定角色
message UserBindRoleReq {
  uint32 user_id = 1 [(validate.rules).uint32.gt = 0]; // 用户ID
  repeated uint32 role_ids = 2 [(validate.rules).repeated.min_items = 1]; // 角色ID集合
}

// 用户绑定的角色
message GetUserRoleReq {
  repeated uint32 user_ids = 1 [(validate.rules).repeated.min_items = 1]; // 用户ID集合
}

message GetUserRoleRsp {
  message Item {
     uint32 user_id = 1; // 用户ID
     repeated UserRole user_role = 2; // 角色集合
  }
  repeated Item data = 1; // 用户绑定的角色
}

// 用户关联的接口权限
message GetUserResourceReq {
  uint32 user_id = 1 [(validate.rules).uint32.gt = 0]; // 用户ID
}
message GetUserResourceRsp {
  repeated uint32 ids = 1; // 资源id集合
}


// 业务类型
enum TreeNodeBizType {
  UNKNOWN_BIZ_TYPE = 0; // 未知
  RESOURCE_NODE = 1; // 接口资源
}

// 树节点定义
message TreeNode {
  uint32 id = 1; // 节点ID
  string name = 2; // 节点名称
  uint32 parent_id = 3; // 父节点ID
  TreeNodeBizType biz_type = 4; // 业务类型


  // 公共字段
  uint32 create_user_id = 6;      // 创建人id
  uint32 update_user_id = 7;      // 更新人id
  uint32 create_time = 8;         // 创建时间
  uint32 update_time = 9;         // 更新时间
  // 查询补充
  string create_user = 100;        // 创建人
  string update_user = 101;        // 更新人

  repeated TreeNode children = 200; // 子节点列表
  string biz_type_desc = 201; // 业务类型
  string tree_node_path = 202;     // 树节点路径
}





// 树形结构表搜索
message SearchTreeNodeReq {
  string search = 1; // 查询条件 {a:?,b:?}

  uint32 page_num = 100 [(validate.rules).uint32.gt = 0]; // 分页查询
  uint32 page_size = 101 [(validate.rules).uint32.gt = 0]; // 分页查询
}

message SearchTreeNodeRsp {
  repeated TreeNode data = 1; // 树形结构表集合

  // 分页数据
  uint32 page_total = 100; // 分页查询
  uint32 page_num = 101; // 分页查询
  uint32 page_size = 102; // 分页查询
}

// 树形结构表详情
message TreeNodeDetailReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 添加修改树形结构表
message AddOrUpdateTreeNodeReq {
  uint32 id = 1; // 节点ID
  string name = 2 [(validate.rules).string.min_len = 1]; // 节点名称
  uint32 parent_id = 3; // 父节点ID
  TreeNodeBizType biz_type = 4 [(validate.rules).enum = {in: [1]}]; // 业务类型
}

// 删除树形结构表
message DeleteTreeNodeReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 获取指定业务类型的树形结构
message GetTreeByBizTypeReq {
  TreeNodeBizType biz_type = 1; // 业务类型
}

message GetTreeByBizTypeRsp {
  repeated TreeNode nodes = 1; // 树节点列表
}


// 权限api
service AuthApi {
  // 菜单搜索
  rpc SearchMenu(SearchMenuReq) returns (SearchMenuRsp) {
    option(trpc.alias) = "/auth/admin/searchMenu";
  }
  // 添加修改菜单
  rpc AddOrUpdateMenu(AddOrUpdateMenuReq) returns (AddOrUpdateRsp) {
    option(trpc.alias) = "/auth/admin/addOrUpdateMenu";
  }
  // 删除菜单
  rpc DeleteMenu(DeleteMenuReq) returns (EmptyRsp) {
    option(trpc.alias) = "/auth/admin/deleteMenu";
  }
  // 菜单详情
  rpc MenuDetail(MenuDetailReq) returns (Menu) {
    option(trpc.alias) = "/auth/admin/menuDetail";
  }
  // 菜单树
  rpc GetMenuTree(GetMenuTreeReq) returns (GetMenuTreeRsp) {
    option(trpc.alias) = "/auth/admin/getMenuTree";
  }

  // 接口搜索
  rpc SearchResource(SearchResourceReq) returns (SearchResourceRsp) {
    option(trpc.alias) = "/auth/admin/searchResource";
  }
  // 添加修改接口
  rpc AddOrUpdateResource(AddOrUpdateResourceReq) returns (AddOrUpdateRsp) {
    option(trpc.alias) = "/auth/admin/addOrUpdateResource";
  }
  // 删除接口
  rpc DeleteResource(DeleteResourceReq) returns (EmptyRsp) {
    option(trpc.alias) = "/auth/admin/deleteResource";
  }
  // 接口详情
  rpc ResourceDetail(ResourceDetailReq) returns (Resource) {
    option(trpc.alias) = "/auth/admin/resourceDetail";
  }
  // 获取有效状态下的接口
  rpc GetEffectiveResource(GetEffectiveResourceReq) returns (GetEffectiveResourceRsp) {
    option(trpc.alias) = "/auth/effectiveResource";
  }


  // 角色搜索
  rpc SearchRole(SearchRoleReq) returns (SearchRoleRsp) {
    option(trpc.alias) = "/auth/admin/searchRole";
  }
  // 添加修改角色
  rpc AddOrUpdateRole(AddOrUpdateRoleReq) returns (AddOrUpdateRsp) {
    option(trpc.alias) = "/auth/admin/addOrUpdateRole";
  }
  // 删除角色
  rpc DeleteRole(DeleteRoleReq) returns (EmptyRsp)  {
    option(trpc.alias) = "/auth/admin/deleteRole";
  }
  // 角色详情
  rpc RoleDetail(RoleDetailReq) returns (Role)  {
    option(trpc.alias) = "/auth/admin/RoleDetail";
  }

  // 角色绑定菜单权限
  rpc RoleBindMenu(RoleBindMenuReq) returns (EmptyRsp)  {
    option(trpc.alias) = "/auth/admin/roleBindMenu";
  }
  // 角色绑定资源权限
  rpc RoleBindResource(RoleBindResourceReq) returns (EmptyRsp)  {
    option(trpc.alias) = "/auth/admin/roleBindResource";
  }
  // 用户绑定角色
  rpc UserBindRole(UserBindRoleReq) returns (EmptyRsp)  {
    option(trpc.alias) = "/auth/admin/userBindRole";
  }
  // 获取用户绑定的角色
  rpc GetUserRole(GetUserRoleReq) returns (GetUserRoleRsp)  {
    option(trpc.alias) = "/auth/admin/getUserRole";
  }
  // 获取用户关联的接口权限
  rpc GetUserResource(GetUserResourceReq) returns (GetUserResourceRsp)  {
    option(trpc.alias) = "/auth/admin/getUserResource";
  }


  // 树形结构表搜索
  rpc SearchTreeNode(SearchTreeNodeReq) returns (SearchTreeNodeRsp) {
    option(trpc.alias) = "/auth/admin/searchTreeNode";
  }
  // 添加修改树形结构表
  rpc AddOrUpdateTreeNode(AddOrUpdateTreeNodeReq) returns (AddOrUpdateRsp) {
    option(trpc.alias) = "/auth/admin/addOrUpdateTreeNode";
  }
  // 删除树形结构表
  rpc DeleteTreeNode(DeleteTreeNodeReq) returns (EmptyRsp)  {
    option(trpc.alias) = "/auth/admin/deleteTreeNode";
  }
  // 树形结构表详情
  rpc TreeNodeDetail(TreeNodeDetailReq) returns (TreeNode) {
    option(trpc.alias) = "/auth/admin/treeNodeDetail";
  }

  // 获取指定业务类型的树形结构
  rpc GetTreeByBizType (GetTreeByBizTypeReq) returns (GetTreeByBizTypeRsp) {
    option(trpc.alias) = "/auth/admin/getTreeByBizType";
  }

}