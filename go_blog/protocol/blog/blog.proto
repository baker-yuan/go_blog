syntax = "proto3";

package go_blog.blog;

option  go_package ="github.com/baker-yuan/go-blog/go_blog/protocol/blog";

import "validate/validate.proto";
import "trpc/proto/trpc_options.proto";
import "trpc/swagger/swagger.proto";

// validate参考
// https://github.com/bufbuild/protoc-gen-validate/blob/v1.0.2/README.md

// trpc参考
// https://github.com/trpc-group/trpc-cmdline/blob/483259c22a2fd1e477c7ebc4b5b1572a5a47010c/docs/examples/example-1/README.zh_CN.md
// https://github.com/trpc-group/trpc-cmdline/blob/483259c22a2fd1e477c7ebc4b5b1572a5a47010c/docs/examples/example-2/README.zh_CN.md

// 空响应
message EmptyRsp {

}

// 添加修改资源返回值
message AddOrUpdateRsp {
  uint32 id = 1; // 资源id
}


// 资源类型
enum ResourceType {
  RT_UNKNOWN = 0; // 未知
  TB_ARTICLE = 1; // 文章
  TB_CATEGORY = 2; // 文章
  TB_Tag = 3; // 标签
  TB_FRIEND_LINK = 4; // 友链
  TB_PAGE = 5; // 页面
}


// 文章类型枚举定义
enum ArticleType {
  ARTICLE_TYPE_UNKNOWN = 0;     // 未知类型
  ARTICLE_TYPE_ORIGINAL = 1;    // 原创
  ARTICLE_TYPE_REPOST = 2;      // 转载
  ARTICLE_TYPE_TRANSLATION = 3; // 翻译
}

// 文章状态枚举定义
enum ArticleStatus {
  ARTICLE_STATUS_DRAFT = 0;       // 草稿
  ARTICLE_STATUS_PUBLISHED = 1;   // 已发布
}

// 文章格式枚举定义
enum ArticleFormat {
  ARTICLE_FORMAT_UNKNOWN = 0;       // 未知格式
  ARTICLE_FORMAT_MARKDOWN = 1;      // Markdown格式
  ARTICLE_FORMAT_RICH_TEXT = 2;     // 富文本格式
}

// 文章可见性枚举定义
enum ArticleVisibility {
  ARTICLE_VISIBILITY_UNKNOWN = 0;             // 未知可见性
  ARTICLE_VISIBILITY_PUBLIC = 1;              // 公开
  ARTICLE_VISIBILITY_PRIVATE = 2;             // 私密
  ARTICLE_VISIBILITY_PASSWORD_PROTECTED = 3;  // 密码保护
}

// 文章信息定义
message Article {
  // 基本数据
  uint32 id = 1;                  // 主键
  uint32 category_id = 2;         // 文章分类表ID
  string title = 3;               // 文章标题
  string description = 4;         // 文章简介
  string content = 5;             // 文章内容
  string cover_image = 6;         // 文章封面图片
  string original_url = 7;        // 原文链接

  // 辅助信息
  string password = 8;            // 密码保护
  uint32 words = 9;               // 文章字数
  uint32 read_time = 10;          // 阅读时长（分钟）

  // 类型描述
  ArticleType type = 11;                  // 文章类型
  ArticleStatus status = 12;              // 文章状态
  ArticleFormat format = 13;              // 文章格式
  ArticleVisibility visibility = 14;      // 文章可见性

  // 标志位
  bool is_top = 15;                 // 是否置顶
  bool is_recommend = 16;           // 是否推荐
  bool is_appreciation = 17;        // 是否开启赞赏
  bool is_comment_enabled = 18;     // 是否开启评论

  // 逻辑删除
  bool is_deleted = 19;             // 是否删除

  // 公共字段
  uint32 create_user_id = 1000;     // 创建人id
  uint32 update_user_id = 1001;     // 更新人id
  uint32 create_time = 1002;        // 创建时间
  uint32 update_time = 1003;        // 更新时间
  // 查询补充字段
  string create_user = 2000;        // 创建人id
  string update_user = 2001;        // 更新人id
}


// 文章搜索
message SearchArticleReq {
  string search = 1; // 查询条件 {a:?,b:?}

  uint32 page_num = 100 [(validate.rules).uint32.gt = 0]; // 分页查询
  uint32 page_size = 101 [(validate.rules).uint32.gt = 0]; // 分页查询
}

message SearchArticleRsp {
  uint32 total = 1; // 分页查询
  repeated Article data = 2; // 文章集合
}

// 文章详情
message ArticleDetailReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 添加修改文章
message AddOrUpdateArticleReq {
  // 基本数据
  uint32 id = 1;                  // 主键
  uint32 category_id = 2 [(validate.rules).uint32.gt = 0];         // 文章分类表ID
  string title = 3 [(validate.rules).string.min_len = 1];               // 文章标题
  string description = 4 [(validate.rules).string.min_len = 1];         // 文章简介
  string content = 5 [(validate.rules).string.min_len = 1];             // 文章内容
  string cover_image = 6;         // 文章封面图片
  string original_url = 7;        // 原文链接

  // 辅助信息
  string password = 8;            // 密码保护

  // 类型描述
  ArticleType type = 11 [(validate.rules).enum = {in: [1,2,3]}];                  // 文章类型
  ArticleStatus status = 12 [(validate.rules).enum = {in: [0,1]}];              // 文章状态
  ArticleFormat format = 13 [(validate.rules).enum = {in: [1,2]}];              // 文章格式
  ArticleVisibility visibility = 14 [(validate.rules).enum = {in: [1,2,3]}];      // 文章可见性

  // 标志位
  bool is_top = 15;                 // 是否置顶
  bool is_recommend = 16;           // 是否推荐
  bool is_appreciation = 17;        // 是否开启赞赏
  bool is_comment_enabled = 18;     // 是否开启评论
}

// 删除文章
message DeleteArticleReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}



// Tag 文章标签
message Tag {
  uint32 id = 1;           // 主键
  string name = 2;         // 标签名
  string description = 3;  // 标签描述
  string color = 4;        // 标签颜色
  // 公共字段
  uint32 create_user_id = 1000;     // 创建人id
  uint32 update_user_id = 1001;     // 更新人id
  uint32 create_time = 1002;        // 创建时间
  uint32 update_time = 1003;        // 更新时间
  // 查询补充字段
  string create_user = 2000;        // 创建人id
  string update_user = 2001;        // 更新人id
}

// 文章标签搜索
message SearchTagReq {
  string search = 1; // 查询条件 {a:?,b:?}

  uint32 page_num = 100 [(validate.rules).uint32.gt = 0]; // 分页查询
  uint32 page_size = 101 [(validate.rules).uint32.gt = 0]; // 分页查询
}

message SearchTagRsp {
  uint32 total = 1; // 分页查询
  repeated Tag data = 2; // 文章标签集合
}

// 文章标签详情
message TagDetailReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 添加修改文章标签
message AddOrUpdateTagReq {
  uint32 id = 1;           // 主键
  string name = 2 [(validate.rules).string.min_len = 1];         // 标签名
  string description = 3;  // 标签描述
  string color = 4 [(validate.rules).string.min_len = 1];        // 标签颜色
}

// 删除文章标签
message DeleteTagReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}



// 页面信息定义
message Page {
  uint32 id = 1;          // 页面id
  string page_name = 2;   // 页面名
  string page_label = 3;  // 页面标签
  string page_cover = 4;  // 页面封面
  // 公共字段
  uint32 create_user_id = 1000;     // 创建人id
  uint32 update_user_id = 1001;     // 更新人id
  uint32 create_time = 1002;        // 创建时间
  uint32 update_time = 1003;        // 更新时间
  // 查询补充字段
  string create_user = 2000;        // 创建人id
  string update_user = 2001;        // 更新人id
}

// 页面搜索
message SearchPageReq {
  string search = 1; // 查询条件 {a:?,b:?}

  uint32 page_num = 100 [(validate.rules).uint32.gt = 0]; // 分页查询
  uint32 page_size = 101 [(validate.rules).uint32.gt = 0]; // 分页查询
}

message SearchPageRsp {
  uint32 total = 1; // 分页查询
  repeated Page data = 2; // 页面集合
}

// 页面详情
message PageDetailReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 添加修改页面
message AddOrUpdatePageReq {
  uint32 id = 1;          // 页面id
  string page_name = 2 [(validate.rules).string.min_len = 1];   // 页面名
  string page_label = 3 [(validate.rules).string.min_len = 1];  // 页面标签
  string page_cover = 4 [(validate.rules).string.min_len = 1];  // 页面封面
}

// 删除页面
message DeletePageReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 动态信息定义
message Moment {
  uint32 id = 1;          // 主键
  string content = 2;     // 动态内容
  uint32 likes = 3;       // 点赞数量
  bool is_published = 4;  // 是否公开
  bool is_deleted = 5;    // 是否删除
  // 公共字段
  uint32 create_user_id = 1000;     // 创建人id
  uint32 update_user_id = 1001;     // 更新人id
  uint32 create_time = 1002;        // 创建时间
  uint32 update_time = 1003;        // 更新时间
  // 查询补充字段
  string create_user = 2000;        // 创建人id
  string update_user = 2001;        // 更新人id
}

// 友链状态枚举
enum FriendLinkStatus {
  FL_STATUS_UNKNOWN = 0; // 未知状态
  FL_STATUS_PUBLISHED = 1; // 已发布
  FL_STATUS_OFFLINE = 2; // 以下线
}

// FriendLink 友链信息定义
message FriendLink {
  uint32 id = 1;                  // 主键
  string link_name = 2;           // 链接名
  string link_avatar = 3;         // 链接头像
  string link_address = 4;        // 链接地址
  string link_intro = 5;          // 链接介绍
  FriendLinkStatus status = 6;    // 友链状态 1-已发布 2-以下线
  uint32 sort = 7;                // 友链排序
  bool is_deleted = 8;            // 是否删除
  // 公共字段
  uint32 create_user_id = 1000;     // 创建人id
  uint32 update_user_id = 1001;     // 更新人id
  uint32 create_time = 1002;        // 创建时间
  uint32 update_time = 1003;        // 更新时间
  // 查询补充字段
  string create_user = 2000;        // 创建人id
  string update_user = 2001;        // 更新人id
}

// 友链表搜索
message SearchFriendLinkReq {
  string search = 1; // 查询条件 {a:?,b:?}

  uint32 page_num = 100 [(validate.rules).uint32.gt = 0]; // 分页查询
  uint32 page_size = 101 [(validate.rules).uint32.gt = 0]; // 分页查询
}

message SearchFriendLinkRsp {
  uint32 total = 1; // 分页查询
  repeated FriendLink data = 2; // 友链表集合
}

// 友链表详情
message FriendLinkDetailReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 添加修改友链表
message AddOrUpdateFriendLinkReq {
  uint32 id = 1;                  // 主键
  string link_name = 2 [(validate.rules).string.min_len = 1];           // 链接名
  string link_avatar = 3 [(validate.rules).string.min_len = 1];         // 链接头像
  string link_address = 4 [(validate.rules).string.min_len = 1];        // 链接地址
  string link_intro = 5 [(validate.rules).string.min_len = 1];          // 链接介绍
  FriendLinkStatus status = 6 [(validate.rules).enum = {in: [1,2]}];    // 友链状态 1-已发布 2-以下线
  uint32 sort = 7 [(validate.rules).uint32.gt = 0];                // 友链排序
}

// 删除友链表
message DeleteFriendLinkReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// Config 网站配置信息定义
message Config {
  uint32 id = 1;          // 主键
  string code = 2;        // 唯一编码
  string desc = 3;        // 描述信息
  string config = 4;      // 配置信息
  // 公共字段
  uint32 create_user_id = 1000;     // 创建人id
  uint32 update_user_id = 1001;     // 更新人id
  uint32 create_time = 1002;        // 创建时间
  uint32 update_time = 1003;        // 更新时间
  // 查询补充字段
  string create_user = 2000;        // 创建人id
  string update_user = 2001;        // 更新人id
}


// CategoryStatus 文章分类可用状态枚举
enum CategoryStatus {
  CATEGORY_STATUS_UNAVAILABLE = 0; // 不可用
  CATEGORY_STATUS_AVAILABLE = 1;   // 可用
}

// Category 文章分类信息定义
message Category {
  // 基本信息
  uint32 id = 1;          // 主键
  string name = 2;        // 文章类型名
  string description = 3; // 类型介绍
  uint32 sort = 4;         // 排序
  //
  CategoryStatus available = 5; // 是否可用
  // 公共字段
  uint32 create_user_id = 1000;     // 创建人id
  uint32 update_user_id = 1001;     // 更新人id
  uint32 create_time = 1002;        // 创建时间
  uint32 update_time = 1003;        // 更新时间
  // 查询补充字段
  string create_user = 2000;        // 创建人id
  string update_user = 2001;        // 更新人id
}


// 文章分类搜索
message SearchCategoryReq {
  string search = 1; // 查询条件 {a:?,b:?}

  uint32 page_num = 100 [(validate.rules).uint32.gt = 0]; // 分页查询
  uint32 page_size = 101 [(validate.rules).uint32.gt = 0]; // 分页查询
}

message SearchCategoryRsp {
  uint32 total = 1; // 分页查询
  repeated Category data = 2; // 文章分类集合
}

// 文章分类详情
message CategoryDetailReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 添加修改文章分类
message AddOrUpdateCategoryReq {
  // 基本信息
  uint32 id = 1;          // 主键
  string name = 2 [(validate.rules).string.min_len = 1];        // 文章类型名
  string description = 3; // 类型介绍
  uint32 sort = 4 [(validate.rules).uint32.gt = 0];         // 排序
  //
  CategoryStatus available = 5 [(validate.rules).enum = {in: [0,1]}]; // 是否可用
}

// 删除文章分类
message DeleteCategoryReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}



// ArticleTag 文章标签关联信息定义
message ArticleTag {
  uint32 id = 1;          // 主键
  uint32 tag_id = 2;      // 标签表ID
  uint32 article_id = 3;  // 文章ID
  uint32 create_time = 4; // 创建时间
  uint32 update_time = 5; // 更新时间
}







// 博客api
service BlogApi {
  // 文章搜索
  rpc SearchArticle (SearchArticleReq) returns (SearchArticleRsp) {
    option(trpc.alias) = "/blog/admin/searchArticle";
  }
  // 添加修改文章
  rpc AddOrUpdateArticle (AddOrUpdateArticleReq) returns (AddOrUpdateRsp) {
    option(trpc.alias) = "/blog/admin/addOrUpdateArticle";
  }
  // 删除文章
  rpc DeleteArticle (DeleteArticleReq) returns (EmptyRsp) {
    option(trpc.alias) = "/blog/admin/deleteArticle";
  }
  // 文章详情
  rpc ArticleDetail (ArticleDetailReq) returns (Article) {
    option(trpc.alias) = "/blog/admin/articleDetail";
  }


  // 文章分类搜索
  rpc SearchCategory(SearchCategoryReq) returns (SearchCategoryRsp) {
    option(trpc.alias) = "/blog/admin/searchCategory";
  }
  // 添加修改文章分类
  rpc AddOrUpdateCategory(AddOrUpdateCategoryReq) returns (AddOrUpdateRsp) {
    option(trpc.alias) = "/blog/admin/addOrUpdateCategory";
  }
  // 删除文章分类
  rpc DeleteCategory(DeleteCategoryReq) returns (EmptyRsp)  {
    option(trpc.alias) = "/blog/admin/deleteCategory";
  }
  // 文章分类详情
  rpc CategoryDetail(CategoryDetailReq) returns (Category)  {
    option(trpc.alias) = "/blog/admin/CategoryDetail";
  }

  // 文章标签搜索
  rpc SearchTag(SearchTagReq) returns (SearchTagRsp) {
    option(trpc.alias) = "/blog/admin/searchTag";
  }
  // 添加修改文章标签
  rpc AddOrUpdateTag(AddOrUpdateTagReq) returns (AddOrUpdateRsp) {
    option(trpc.alias) = "/blog/admin/addOrUpdateTag";
  }
  // 删除文章标签
  rpc DeleteTag(DeleteTagReq) returns (EmptyRsp)  {
    option(trpc.alias) = "/blog/admin/deleteTag";
  }
  // 文章标签详情
  rpc TagDetail(TagDetailReq) returns (Tag)  {
    option(trpc.alias) = "/blog/admin/tagDetail";
  }


  // 友链表搜索
  rpc SearchFriendLink(SearchFriendLinkReq) returns (SearchFriendLinkRsp) {
    option(trpc.alias) = "/blog/admin/searchFriendLink";
  }
  // 添加修改友链表
  rpc AddOrUpdateFriendLink(AddOrUpdateFriendLinkReq) returns (AddOrUpdateRsp) {
    option(trpc.alias) = "/blog/admin/addOrUpdateFriendLink";
  }
  // 删除友链表
  rpc DeleteFriendLink(DeleteFriendLinkReq) returns (EmptyRsp)  {
    option(trpc.alias) = "/blog/admin/deleteFriendLink";
  }
  // 友链表详情
  rpc FriendLinkDetail(FriendLinkDetailReq) returns (FriendLink)  {
    option(trpc.alias) = "/blog/admin/friendLinkDetail";
  }

  // 页面搜索
  rpc SearchPage(SearchPageReq) returns (SearchPageRsp) {
    option(trpc.alias) = "/blog/admin/searchPage";
  }
  // 添加修改页面
  rpc AddOrUpdatePage(AddOrUpdatePageReq) returns (AddOrUpdateRsp) {
    option(trpc.alias) = "/blog/admin/addOrUpdatePage";
  }
  // 删除页面
  rpc DeletePage(DeletePageReq) returns (EmptyRsp)  {
    option(trpc.alias) = "/blog/admin/deletePage";
  }
  // 页面详情
  rpc PageDetail(PageDetailReq) returns (Page)  {
    option(trpc.alias) = "/blog/admin/pageDetail";
  }



}