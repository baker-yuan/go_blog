syntax = "proto3";
package go_blog.exterior;
option  go_package ="github.com/baker-yuan/go-blog/go_blog/protocol/exterior";

import "validate/validate.proto";
import "trpc/proto/trpc_options.proto";
import "trpc/swagger/swagger.proto";

// 资源类型
enum ResourceType {
  RT_UNKNOWN = 0; // 未知
  TB_OSS_UPLOAD_RECORD = 1; // OSS文件上传记录
  TB_OSS_FILE_PATH = 2; // 文件路径
}

// 空响应
message EmptyRsp {

}

// 添加修改资源返回值
message AddOrUpdateRsp {
  uint32 id = 1; // 资源id
}


// OSS文件上传记录信息定义
message OssUploadRecord {
  uint32 id = 1;          // 主键
  uint32 uid = 2;         // 用户ID
  string patch = 3;       // 文件路径
  string mode = 4;        // 模块
  OssType os_type = 5;     // OSS厂商
  OssStatus status = 6;      // 状态
  // 公共字段
  uint32 create_user_id = 1000;     // 创建人id
  uint32 update_user_id = 1001;     // 更新人id
  uint32 create_time = 1002;        // 创建时间
  uint32 update_time = 1003;        // 更新时间
  // 查询补充字段
  string create_user = 2000;        // 创建人id
  string update_user = 2001;        // 更新人id
  string url = 3000; // 路径
}

// OSS厂商枚举
enum OssType {
  UNKNOWN = 0; // 未知
  ALI_YUN = 1;  // 阿里云
}

// 上传状态枚举
enum OssStatus {
  UNPROCESSED = 0; // 未处理
  GEN_SIGN = 1;     // 获取签名
  SUCCESS = 2;     // 上传成功
  FAILURE = 3;     // 上传失败
}

// OSS文件上传记录搜索
message SearchOssUploadRecordReq {
  string search = 1; // 查询条件 {a:?,b:?}

  uint32 page_num = 100 [(validate.rules).uint32.gt = 0]; // 分页查询
  uint32 page_size = 101 [(validate.rules).uint32.gt = 0]; // 分页查询
}

message SearchOssUploadRecordRsp {
  repeated OssUploadRecord data = 1; // OSS文件上传记录集合

  // 分页数据
  uint32 page_total = 100; // 分页查询
  uint32 page_num = 101; // 分页查询
  uint32 page_size = 102; // 分页查询
}

// GetUploadSignRsp 上传签名信息
message GetUploadSignReq {
  string mode = 1 [(validate.rules).string.min_len = 1]; // 模块
  string file_name = 2 [(validate.rules).string.min_len = 1]; // 文件名称
  string content_md5 = 3 [(validate.rules).string.min_len = 1]; // 文件md5值
}

// GetUploadSignRsp 上传签名信息
//
// 首页>对象存储>实践教程>网站与移动应用>客户端直传>Web端直传实践>服务端签名直传
// https://help.aliyun.com/zh/oss/use-cases/obtain-signature-information-from-the-server-and-upload-data-to-oss?spm=a2c6h.12873639.article-detail.7.a56b3ce8VFIlxX
// https://help.aliyun.com/zh/oss/use-cases/overview-20?spm=a2c4g.11186623.0.i3#concept-qp2-g4y-5db
message GetUploadSignRsp {
  // 上传参数
  string upload_url = 1; // 图片地址
  map<string, string> form_data = 2; // 表单参数
  // 其他
  string image_url = 10; // 上传地址
  string image_path = 11; // 相对路径
  OssType os_type = 100; // OSS厂商
}

// 阿里云OSS服务端签名直传上传回调
message AliOssCallbackReq {
  string filename = 1; // 文件名称
}

message AliOssCallbackRsp {

}

// OssFilePath OSS模块配置
message OssModeCfg {
  uint32 id = 1; // 主键
  string mode = 2; // 模块
  string path = 3; // 路径
  string desc = 4; // 描述
  // 公共字段
  uint32 create_user_id = 1000;     // 创建人id
  uint32 update_user_id = 1001;     // 更新人id
  uint32 create_time = 1002;        // 创建时间
  uint32 update_time = 1003;        // 更新时间
  // 查询补充字段
  string create_user = 2000;        // 创建人id
  string update_user = 2001;        // 更新人id
}



// OSS模块配置搜索
message SearchOssModeCfgReq {
  string search = 1; // 查询条件 {a:?,b:?}

  uint32 page_num = 100 [(validate.rules).uint32.gt = 0]; // 分页查询
  uint32 page_size = 101 [(validate.rules).uint32.gt = 0]; // 分页查询
}

message SearchOssModeCfgRsp {
  repeated OssModeCfg data = 1; // OSS模块配置集合

  // 分页数据
  uint32 page_total = 100; // 分页查询
  uint32 page_num = 101; // 分页查询
  uint32 page_size = 102; // 分页查询
}

// OSS模块配置详情
message OssModeCfgDetailReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}

// 添加修改OSS模块配置
message AddOrUpdateOssModeCfgReq {
    uint32 id = 1; // 主键
    string mode = 2 [(validate.rules).string.min_len = 1]; // 模块
    string path = 3 [(validate.rules).string.min_len = 1]; // 路径
    string desc = 4 [(validate.rules).string.min_len = 1]; // 描述
}

// 删除OSS模块配置
message DeleteOssModeCfgReq {
  uint32 id = 1 [(validate.rules).uint32.gt = 0]; // 编号
}


// oss文件上传
service OssApi {
  // OSS文件上传记录搜索
  rpc SearchOssUploadRecord(SearchOssUploadRecordReq) returns (SearchOssUploadRecordRsp) {
    option(trpc.alias) = "/external/admin/searchOssUploadRecord";
  }
  // 获取oss上传签名
  rpc GetUploadSign(GetUploadSignReq) returns (GetUploadSignRsp) {
    option(trpc.alias) = "/external/admin/getUploadSign";
  }
  // 阿里云OSS服务端签名直传上传回调
//  rpc AliOssCallback(AliOssCallbackReq) returns (AliOssCallbackRsp) {
//    option(trpc.alias) = "/external/callback/aliOss";
//  }

  // OSS模块配置搜索
  rpc SearchOssModeCfg(SearchOssModeCfgReq) returns (SearchOssModeCfgRsp) {
    option(trpc.alias) = "/external/admin/searchOssModeCfg";
  }
  // 添加修改OSS模块配置
  rpc AddOrUpdateOssModeCfg(AddOrUpdateOssModeCfgReq) returns (AddOrUpdateRsp) {
    option(trpc.alias) = "/external/admin/addOrUpdateOssModeCfg";
  }
  // 删除OSS模块配置
  rpc DeleteOssModeCfg(DeleteOssModeCfgReq) returns (EmptyRsp)  {
    option(trpc.alias) = "/external/admin/deleteOssModeCfg";
  }
  // OSS模块配置详情
  rpc OssModeCfgDetail(OssModeCfgDetailReq) returns (OssModeCfg)  {
    option(trpc.alias) = "/external/admin/ossModeCfgDetail";
  }

}